name: RPG Windows release build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.16.0'}
      - run: python -m pip install -r requirements-rpg.lock
      - shell: pwsh
        run: |
          New-Item -ItemType Directory .tools/js | Out-Null
          Copy-Item -LiteralPath Tools/package.json -Destination .tools/js/package.json
          Copy-Item -LiteralPath Tools/package-lock.json -Destination .tools/js/package-lock.json
          npm ci --prefix .tools/js --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - run: python -m pytest tests/game_project/test_external_tools.py tests/game_project/test_gui_build_controls.py -q -p no:cacheprovider
      - name: Build and audit application
        shell: pwsh
        run: |
          $buildOutput = & ./Tools/build_rpg.ps1 -Python (Get-Command python).Source
          $buildOutput | Write-Output
          $app = @($buildOutput)[-1]
          $env:AINIEE_EXTERNAL_TOOLS_HOME = Join-Path $env:RUNNER_TEMP 'external-tools'
          $env:AINIEE_EXTERNAL_TOOLS_CONFIG = Join-Path $env:RUNNER_TEMP 'external-tools.json'
          & (Join-Path $app 'AiNieeRPG.exe') --gui-check (Join-Path $env:RUNNER_TEMP 'gui-check')
          if ($LASTEXITCODE -ne 0) { throw 'Frozen GUI check failed' }
          python Tools/audit_rpg_package.py --package $app --output (Join-Path $env:RUNNER_TEMP 'release')
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed' }
          $version = python -c 'from ModuleFolders.Domain.GameProject.Version import VERSION;print(VERSION)'
          $archive = Join-Path $env:RUNNER_TEMP "release/AiNieeRPG-source-$version.zip"
          git archive --format=zip --prefix=AiNieeRPG-source/ -o $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release/SHA256SUMS.txt') -Value ($hash+'  '+(Split-Path -Leaf $archive)) -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rpg-windows-release
          path: ${{ runner.temp }}/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpg-frozen-gui-evidence
          path: ${{ runner.temp }}/gui-check
