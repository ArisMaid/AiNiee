name: RPG core acceptance
on:
  workflow_dispatch:
  push:
    paths: ['ModuleFolders/**', 'UserInterface/GameProject/**', 'Tools/**', 'tests/game_project/**', 'Resource/GameProfiles/**', 'Resource/RpgRuntime/**', 'RpgApp.py', 'requirements-rpg.lock']
  pull_request:
    paths: ['ModuleFolders/**', 'UserInterface/GameProject/**', 'Tools/**', 'tests/game_project/**', 'RpgApp.py']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.16.0'}
      - run: python -m pip install -r requirements-rpg.lock
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/js | Out-Null
          Copy-Item -LiteralPath Tools/package.json -Destination .tools/js/package.json
          Copy-Item -LiteralPath Tools/package-lock.json -Destination .tools/js/package-lock.json
          npm ci --prefix .tools/js --ignore-scripts --no-audit --no-fund
      - run: python -m pytest tests/game_project -q -p no:cacheprovider
      - run: python RpgApp.py --self-check work/ci-selfcheck
      - run: python RpgApp.py --gui-check work/ci-gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-rpg-acceptance
          path: work/ci-gui
